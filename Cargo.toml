[workspace]
resolver = "2"
members = [
    "crates/examplus-core",
    "crates/examplus-server",
    "crates/examplus-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ExamPlus Team <support@examplus.local>"]
license = "LicenseRef-ExamPlus-NC-EDU-1.0"
license-file = "LICENSE"

[workspace.dependencies]
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
